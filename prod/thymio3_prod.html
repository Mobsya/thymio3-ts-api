  // ==========================================
  // CONNECTION & AUTO-STREAMING
  // ==========================================
  async function connectAndStream() {
    try {
        document.getElementById('connection-status').innerText = "Connecting...";
      // Connect to the device
      const device = await thymio.requestAndConnect();
      
      // Update UI with the BLE name
      //const deviceName = thymio.getDeviceName(); 
      //const statusLbl = document.getElementById('connection-status');
      //statusLbl.innerText = `Connected to ${deviceName}`; 
      //statusLbl.style.color = "#2e7d32";
      
      // Start sensor streams automatically
      // Use a small delay to ensure the GATT server is fully ready
      setTimeout(async () => {
        //await thymio.startSensorStreaming();
        await thymio.startBothSensorStreaming();
        console.log("Sensor streaming active.");
      }, 500);

    } catch (err) {
      console.error("Connection failed", err);
      document.getElementById('connection-status').innerText = "Connection Failed";
      //document.dispatchEvent(new Event('thymio-disconnected'));
    }
  }

  async function handleDisconnect() {
    await thymio.disconnect();
    //const statusLbl = document.getElementById('connection-status');
    //statusLbl.innerText = "Disconnected";
    //statusLbl.style.color = "#d32f2f";
  }

// Listener for connection state changes
// thymio-connected now dispatches the connection state in event.detail
document.addEventListener("thymio-connected", (event) => {
    const statusLbl = document.getElementById('connection-status');

    if (event.detail) {
        const deviceName = thymio.getDeviceName();
        statusLbl.innerText = `Connected to ${deviceName}`;
        statusLbl.className = "status-connected";
        console.log("Thymio Link Active.");
    } else {
        statusLbl.innerText = "Disconnected";
        statusLbl.className = "status-disconnected";

        // Safety: Hide loading overlay if it was visible during a crash
        document.getElementById('upload-overlay').style.display = 'none';
        console.warn("Thymio Link Lost.");
    }
});


  // ==========================================
  // SENSOR VISUALIZATION
  // ==========================================
  
  // Listener for Main Sensors
  document.addEventListener("thymio-sensor-values", (event) => {
    const data = event.detail;
    //console.log("Main sensors data:", data);
    //console.log("prox:", data.proximitySensors);
    if (data.proximitySensors) {
        const p = data.proximitySensors;
        const proxValues = [p.left, p.frontLeft, p.center, p.frontRight, p.right, p.backLeft, p.backRight];
        document.getElementById('lbl-prox').innerText = proxValues.join(', ');
    }
    if (data.groundSensors) {
        const g = data.groundSensors;
        const groundValues = [g.left, g.right];
        document.getElementById('lbl-ground').innerText = groundValues.join(', ');
    }
    if (data.accelerationRaw) {
        const acc = data.accelerationRaw;
        const accValues = [acc.x, acc.y, acc.z];
        document.getElementById('lbl-accel').innerText = accValues.join(', ');
    }
  });

  // Listener for Other Sensors
  document.addEventListener("thymio-sensor-other-values", (event) => {
    const data = event.detail;
    if (data.colorRaw) {
        const c = data.colorRaw;
        document.getElementById('lbl-color').innerText = `${c.red}, ${c.green}, ${c.blue}, ${c.clear}`;
    }
  });

let calibrationFinalState = null;

async function runScript(type) {
    const overlay = document.getElementById("upload-overlay");
    const statusText = document.getElementById("upload-status-text");
    
    try {
        // 1. Show the loading indication
        overlay.style.display = "flex";
        statusText.innerText = "Uploading script to Thymio...";

        // 2. Perform the upload
        await thymio.sendPythonScript(scripts[type]);
        
        // 3. Update text before execution
        statusText.innerText = "Starting execution...";
        await thymio.executeLoadedScript();

    } catch (err) {
        console.error("Upload/Execution failed", err);
        alert("Failed to send script: " + err.message);
    } finally {
        // 4. Hide the indication regardless of success/fail
        overlay.style.display = "none";
    }

    // --- Rest of your existing logic for UI reset ---
    let stdOutOutput = document.getElementById("std-out-output");
    stdOutOutput.textContent = "Waiting for data...";
    
    if (type === "calib") {
        calibrationFinalState = null;
        const panel = document.getElementById("calibration-panel");
        const title = document.getElementById("calibration-title");
        panel.classList.remove("calibration-success");
        panel.classList.remove("calibration-failure");
        title.innerText = "Calibration Results";
        let calibContainer = document.getElementById("calibration-results-container");
        calibContainer.innerHTML = "...";
    }
}

function updateCalibrationStatus(stdoutText) {
    const panel = document.getElementById("calibration-panel");
    const title = document.getElementById("calibration-title");

    // Do nothing if final state already detected
    if (calibrationFinalState !== null) {
        return;
    }

    if (stdoutText.includes("calibration completed successfully!")) {
        calibrationFinalState = "success";

        panel.classList.add("calibration-success");
        title.innerText = "Calibration Results - SUCCESS";
    }
    else if (stdoutText.includes("calibration timeout!")) {
        calibrationFinalState = "failure";

        panel.classList.add("calibration-failure");
        title.innerText = "Calibration Results - FAILED";
    }
}

document.addEventListener("thymio-std-out-values", (event) => { 
    const outputText = String(event.detail);
    const stdOutOutput = document.getElementById("std-out-output");
    
    if (stdOutOutput.textContent === "Waiting for data...") stdOutOutput.textContent = "";
    
    // Evita di aggiungere a capo doppi se l'output li contiene già
    stdOutOutput.textContent += outputText + (outputText.endsWith('\n') ? '' : '\n');
    stdOutOutput.scrollTop = stdOutOutput.scrollHeight;
    
    // Dividiamo l'output in righe singole per gestire i messaggi raggruppati
    const lines = outputText.split('\n');
    
    for (let line of lines) {
        if (line.includes('=')) {
            const calibContainer = document.getElementById("calibration-results-container");
            if (calibContainer.innerHTML.includes("...")) calibContainer.innerHTML = "";
            
            // Usiamo indexOf per separare SOLO al primo '=', proteggendo eventuali array come [0, 0, 0]
            const eqIndex = line.indexOf('=');
            const key = line.substring(0, eqIndex).trim();
            const value = line.substring(eqIndex + 1).trim();
            
            // Rimuoviamo tutti i caratteri non alfanumerici per avere un ID HTML valido
            const rowId = `row-${key.replace(/[^a-zA-Z0-9]/g, '')}`;
            
            let row = document.getElementById(rowId);
            if (!row) {
                row = document.createElement("div");
                row.id = rowId;
                row.className = "calib-data";
                row.innerHTML = `<span>${key}:</span> <strong>${value}</strong>`;
                calibContainer.appendChild(row);
            } else {
                row.querySelector('strong').innerText = value;
            }
        }
    }
    updateCalibrationStatus(outputText);
  });
